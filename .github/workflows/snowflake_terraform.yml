name: "Snowflake Terraform Demo Workflow"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  snowflake-terraform-demo:
    name: "Snowflake Terraform Demo Job"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Az login OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Snowflake OIDC 
        uses: snowflakedb/snowflake-actions@v3 
        with: 
          use-oidc: true
      
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: "snowflake/terraform"

      - name: Terraform Init -upgrade
        id: init
        run: terraform init
        working-directory: "snowflake/terraform"


      - name: Terraform Plan
        id: plan
        run: terraform plan
        working-directory: "snowflake/terraform"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: "snowflake/terraform"


