name: Snowflake DCM Deploy - Test

on:
  push:
    branches:
      - test
    paths:
      - 'snowflake/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

jobs:
  dcm-deploy:
    uses: ./.github/workflows/dcm-plan-deploy.yml
    with:
      project_path: ./snowflake/project/Retail/
      environment: test
      target: test
      dcm_mode: deploy
      allow_object_drop: false
    secrets: inherit