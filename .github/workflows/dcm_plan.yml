name: Snowflake DCM Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# The job MUST use a GitHub Environment whose name matches the target
# (so that OIDC tokens are scoped correctly).

# Example usage:

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: snowflakedb/snowflake-actions/dcm/plan@v3
        with:
          target: dev
          project-path: snowflake/my_dcm_project/
          snowflake-user: GITHUB_ACTIONS_SNOWFLAKE