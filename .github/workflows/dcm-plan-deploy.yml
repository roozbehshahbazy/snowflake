name: Snowflake DCM Plan

on:
    workflow_call:
        inputs:
            project_path:
                required: true
                type: string
            environment:
                required: false
                type: string
                default: dev
            target:
                required: false
                type: string
                default: dev
            dcm_mode:
                required: false
                type: string
                default: plan
            allow_object_drop:
                required: true
                type: boolean
                default: false

jobs:
    plan:
      if: ${{ inputs.dcm_mode == 'plan' }}
      runs-on: ubuntu-latest
      environment: ${{ inputs.environment }}
      permissions:
        id-token: write
        contents: read
      steps:
        - name: Checkout
          uses: actions/checkout@v7
        
        - name: DCM Plan
          uses: snowflakedb/snowflake-actions/dcm/plan@v3
          with:
            target: ${{ inputs.target }}
            project-path: ${{ inputs.project_path }}
            snowflake-user: ${{ secrets.SNOWFLAKE_USER }}
    
    deploy:
        if: ${{ inputs.dcm_mode  == 'deploy' }}
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        permissions:
          id-token: write
          contents: read
        steps:
          - name: Checkout 
            uses: actions/checkout@v7

          - name: DCM Plan
            uses: snowflakedb/snowflake-actions/dcm/plan@v3
            with:
              target: ${{ inputs.target }}
              project-path: ${{ inputs.project_path }}
              snowflake-user: ${{ secrets.SNOWFLAKE_USER }}
          
          - name: DCM Deploy
            uses: snowflakedb/snowflake-actions/dcm/deploy@v3
            with:
              target: ${{ inputs.target }}
              project-path: ${{ inputs.project_path }}
              snowflake-user: ${{ secrets.SNOWFLAKE_USER }}
              allow-drops: ${{ inputs.allow_object_drop }}
