name: "Snowflake Terraform Demo Workflow"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  snowflake-terraform-demo:
    name: "Snowflake Terraform Demo Job"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Az login OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: "snowflake/terraform"

      - name: Terraform Init -upgrade
        id: init
        run: terraform init
        working-directory: "snowflake/terraform"

      - name: Get Azure token for Snowflake
        shell: bash
        run: |
          token=$(az account get-access-token \
            --resource "api://fd3f753b-eed3-462c-b6a7-a4b5bb650aad" \
            --query accessToken \
            --output tsv)

          if [ -z "$token" ]; then
            echo "Failed to obtain Azure access token for Snowflake"
            exit 1
          fi

          echo "SNOWFLAKE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Terraform Plan
        id: plan
        run: terraform plan
        working-directory: "snowflake/terraform"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: "snowflake/terraform"


