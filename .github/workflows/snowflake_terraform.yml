name: "Snowflake Terraform Demo Workflow"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  snowflake-terraform-demo:
    name: "Snowflake Terraform Demo Job"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Az login OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: "snowflake/terraform"

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: "snowflake/terraform"

      - name: Get GitHub OIDC token
        id: snowflake_oidc
        shell: bash
        run: |
          response=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflakecomputing.com")

          token=$(echo "$response" | jq -r '.value')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to obtain GitHub OIDC token"
            exit 1
          fi

          echo "SNOWFLAKE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Check Snowflake OIDC token
        shell: bash
        run: |
          if [ -z "$SNOWFLAKE_TOKEN" ]; then
            echo "SNOWFLAKE_TOKEN is NOT set"
            exit 1
          fi

          echo "SNOWFLAKE_TOKEN is set"

      - name: Terraform Plan
        id: plan
        run: terraform plan
        working-directory: "snowflake/terraform"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: "snowflake/terraform"


