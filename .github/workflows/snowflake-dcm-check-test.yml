name: Snowflake DCM Check - Test 

on:
  pull_request:
    branches:
      - test
    paths:
      - 'snowflake/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

jobs:
  dcm-plan:
    uses: ./.github/workflows/dcm-plan-deploy.yml
    with:
      project_path: ./snowflake/project
      environment: test
      target: test
      dcm_mode: plan
      allow_object_drop: false
    secrets: inherit